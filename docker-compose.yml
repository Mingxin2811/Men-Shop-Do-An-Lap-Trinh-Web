services:
  postgres:
    image: postgres:16-alpine
    container_name: mens_shop_postgres
    environment:
      POSTGRES_USER: mens_shop
      POSTGRES_PASSWORD: mens_shop_password
      POSTGRES_DB: mens_shop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mens_shop -d mens_shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: mens_shop_backend
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://mens_shop:mens_shop_password@postgres:5432/mens_shop_db?schema=public
      JWT_SECRET: change_me_to_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      PAYMENT_PROVIDER: mock
      STRIPE_SECRET_KEY: sk_test_replace_me
      STRIPE_WEBHOOK_SECRET: whsec_replace_me
      STRIPE_SUCCESS_URL: http://localhost:5173/payment-success
      STRIPE_CANCEL_URL: http://localhost:5173/payment-cancel
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && npm start"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: mens_shop_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
